name: Emulator Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run GX6706 Emulator Unit Tests
    runs-on: ubuntu-latest
    env:
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba_cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Numba JIT compilation
        uses: actions/cache@v4
        with:
          path: ${{ env.NUMBA_CACHE_DIR }}
          key: numba-${{ runner.os }}-py3.12-${{ hashFiles('requirements.txt', 'gx6706_emu.py') }}
          restore-keys: |
            numba-${{ runner.os }}-py3.12-

      - name: Run unit tests
        run: python -m unittest test_emulator.py -v
